<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    #container {
      position: fixed;
      inset: 0;
    }
    #container video,
    #container canvas {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
    }

    .mindar-ui-scanning .scanning .inner {
      border-radius: 10px;
      overflow: hidden;
    }

    #ui nav {
      width: min(90%, 380px);
      pointer-events: auto;
    }
    #ui button.active,
    #ui button.active i {
      color: rgb(118, 23, 23);
    }
    #ui button:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    /* Needed statically for OSM */
    #map {
      width: 100vw;
      height: 70vh;
    }

    canvas {
      z-index: 100 !important;
      touch-action: none !important;
    }
  </style>
</head>

<body class="h-full w-full m-0 overflow-hidden pointer-events-none">
  <div id="container"></div>
  <div id="ui" class="fixed inset-0 z-999 flex items-end justify-center p-0.7">
    <nav class="flex justify-around items-center bg-white/90 rounded-2xl py-3 shadow-xl backdrop-blur-xl">
      <button id="guide-button" class="flex flex-col items-center text-gray-600">
        <i class="fa-solid fa-book-open text-xl"></i>
        <span class="text-[11px]" data-i18n="app.guide-button"></span>
      </button>
      <button id="map-button" class="flex flex-col items-center text-gray-600">
        <i class="fa-solid fa-map text-xl"></i>
        <span class="text-[11px]" data-i18n="app.map-button"></span>
      </button>
      <button id="pause-button" class="flex flex-col items-center text-gray-600">
        <i class="fa-solid fa-circle-pause text-xl"></i>
        <span class="text-[11px]" data-i18n="app.pause-button"></span>
      </button>
      <button id="info-button" class="flex flex-col items-center text-gray-600">
        <i class="fa-solid fa-circle-info text-xl"></i>
        <span class="text-[11px]" data-i18n="app.info-button"></span>
      </button>
      <button id="unpause-button" class="flex flex-col items-center text-gray-600">
        <i class="fa-solid fa-play text-xl"></i>
        <span class="text-[11px]"  data-i18n="app.back-button"></span>
      </button>
    </nav>
  </div>

  <div class="unpause-container">
    <p id="text-unpause"></p>
  </div>

  <div id="infoWS" class="info-background absolute bottom-1/6 z-200 bg-white">
    <div class="info-container">
      <div class="info-content">
        <span class="close">&times;</span>
        <p id="info-text" class="info-text"></p>
      </div>
    </div>
  </div>

  <div id="mapWS" class="map-background bg-white">
    <div class="map-container">
      <div class="map-content">
        <span class="close map-close">&times;</span>
        <div id="map"></div>
      </div>
    </div>
  </div>
  <p id="showme"></p>
  <script type="module" src="src/style.js"></script>
  <script type="module" src="src/main.js"></script>
  <script type="module" src="src/app.js"></script>
  <script src="https://kit.fontawesome.com/34c3e261b7.js" crossorigin="anonymous"></script>
</body>
</html>
